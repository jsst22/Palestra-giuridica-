  if (dr.type === 'scalpel') {
    let html = '';
    let cutCount = 0;
    const notes = [];
    dr.segments.forEach((seg, i) => {
      let displaySeg = seg;
      if (i > 0 && ds.cuts[i - 1] && dr.joiners[i - 1].capitalizedNext) {
        displaySeg = seg.charAt(0).toUpperCase() + seg.slice(1);
      }
      html += escapeHtml(displaySeg);
      if (i < dr.joiners.length) {
        const j = dr.joiners[i];
        const isCut = !!ds.cuts[i];
        if (isCut) {
          cutCount++;
          notes.push(j.note);
          html += `${escapeHtml(j.cutText)}<button class="cut-chip done" onclick="drillScalpel(${d.day}, ${i})">✓ Tagliato</button> `;
        } else {
          html += `${escapeHtml(j.original)}<button class="cut-chip" onclick="drillScalpel(${d.day}, ${i})">✂️ Taglia qui</button>`;
        }
      }
    });
    const rebuilt = dr.segments.map((seg, i) => {
      let s = (i > 0 && ds.cuts[i - 1] && dr.joiners[i - 1].capitalizedNext) ? seg.charAt(0).toUpperCase() + seg.slice(1) : seg;
      return s + (i < dr.joiners.length ? (ds.cuts[i] ? dr.joiners[i].cutText : dr.joiners[i].original) : '');
    }).join('');
    const stats = computeGulpease(rebuilt);
    return `
      <div class="scalpel-doc">${html}</div>
      <div class="telemetry-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="tel-cell ${stats.avgWords <= 25 ? 'good' : 'warn'}"><div class="tel-val">${stats.avgWords}</div><div class="tel-lbl">Parole / frase</div></div>
        <div class="tel-cell"><div class="tel-val">${stats.sentences}</div><div class="tel-lbl">Frasi</div></div>
        <div class="tel-cell ${cutCount === dr.joiners.length ? 'good' : ''}"><div class="tel-val">${cutCount}/${dr.joiners.length}</div><div class="tel-lbl">Tagli eseguiti</div></div>
      </div>
      ${notes.length ? `<div class="feedback-box ok">${notes.map(n => `<div>✓ ${escapeHtml(n)}</div>`).join('')}</div>` : ''}
    `;
  }

  if (dr.type === 'nominal') {
    return dr.pairs.map((p, idx) => {
      const pick = ds.picks[idx];
      const optsHtml = p.options.map((o, oi) => {
        const cls = pick === oi ? (o.ok ? 'selected-ok' : 'selected-bad') : '';
        return `<button class="choice-btn ${cls}" onclick="drillNominal(${d.day}, ${idx}, ${oi})">${escapeHtml(o.text)}</button>`;
      }).join('');
      const fb = (pick !== undefined && p.options[pick])
        ? `<div class="feedback-box ${p.options[pick].ok ? 'ok' : 'bad'}"><strong>${p.options[pick].ok ? '✓ Perfetto!' : '✕ Troppo pesante:'}</strong> ${escapeHtml(p.options[pick].why)}</div>`
        : '';
      return `
        <div class="sorter-card">
          <div class="sorter-term">Trasforma: ${escapeHtml(p.heavy)}</div>
          <div class="choice-list">${optsHtml}</div>
          ${fb}
        </div>`;
    }).join('');
  }

  if (dr.type === 'hunt') {
    const targets = dr.tokens.map((t, i) => t.target ? i : -1).filter(i => i >= 0);
    const foundCount = targets.filter(i => ds.found[i]).length;
    const tokHtml = dr.tokens.map((t, i) => {
      if (!t.target) return `<span>${escapeHtml(t.text)}</span>`;
      const isFound = !!ds.found[i];
      const cls = isFound ? (t.kind === 'es' ? 'found-es' : 'found') : '';
      const label = isFound ? `${t.text} → ${t.replace}` : t.text;
      return `<span class="hunt-tok ${cls}" onclick="drillHunt(${d.day}, ${i})">${escapeHtml(label)}</span>`;
    }).join('');
    return `
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span class="badge ${foundCount === targets.length ? 'badge-ok' : 'badge-indigo'}">Trovati ${foundCount} di ${targets.length}</span>
        <button class="btn btn-ghost btn-sm" onclick="resetDrill(${d.day})">Ricomincia</button>
      </div>
      <div class="hunt-box">${tokHtml}</div>
      ${ds.lastFb ? `<div class="feedback-box ok">${escapeHtml(ds.lastFb)}</div>` : ''}
    `;
  }

  if (dr.type === 'order') {
    const placedIds = ds.placed || [];
    const remaining = dr.items.filter(it => !placedIds.includes(it.id));
    // Deterministic non-sequential visual ordering for remaining chips
    const shuffled = [...remaining].sort((a, b) => {
      const ha = (a.id.charCodeAt(a.id.length - 1) * 7 + a.label.length) % 13;
      const hb = (b.id.charCodeAt(b.id.length - 1) * 7 + b.label.length) % 13;
      return ha - hb;
    });

    const timelineHtml = placedIds.length
      ? `<div class="order-timeline">${placedIds.map(id => {
          const it = dr.items.find(x => x.id === id);
          return `<div class="order-slot">✓ ${escapeHtml(it.label)}<div style="font-size:0.8rem;font-weight:500;margin-top:3px;">${escapeHtml(it.feedback)}</div></div>`;
        }).join('')}</div>`
      : `<div style="font-size:0.86rem;color:var(--ink-muted);margin-bottom:12px;">Tocca il primo blocco corretto qui sotto per iniziare la sequenza:</div>`;

    const poolHtml = shuffled.length
      ? `<div class="order-pool">${shuffled.map(it => {
          const cleanLabel = it.label.replace(/^\d+\.\s*/, '');
          return `<button class="choice-btn" onclick="drillOrder(${d.day}, '${it.id}')">${escapeHtml(cleanLabel)}</button>`;
        }).join('')}</div>`
      : `<div class="feedback-box ok"><strong>✓ Sequenza completata perfettamente!</strong></div>`;

    return `
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span class="badge ${placedIds.length === dr.items.length ? 'badge-ok' : 'badge-indigo'}">Posizionati ${placedIds.length}/${dr.items.length}</span>
        <button class="btn btn-ghost btn-sm" onclick="resetDrill(${d.day})">Ricomincia</button>
      </div>
      ${timelineHtml}
      ${ds.hint ? `<div class="feedback-box bad" style="margin-bottom:12px;">💡 ${escapeHtml(ds.hint)}</div>` : ''}
      ${poolHtml}
    `;
  }

  if (dr.type === 'xray') {
    const openedCount = dr.blocks.filter(b => ds.opened[b.id]).length;
    const blocksHtml = dr.blocks.map(b => {
      const open = !!ds.opened[b.id];
      return `
        <div class="xray-block ${open ? 'opened' : ''}" onclick="drillXray(${d.day}, '${b.id}')">
          <span class="xray-tag">${escapeHtml(b.tag)} ${open ? '✓' : '· Tocca per ispezionare'}</span>
          <p class="xray-text">${escapeHtml(b.text)}</p>
          ${open ? `<div class="feedback-box ok" style="margin-top:12px;"><strong>Funzione tattica:</strong> ${escapeHtml(b.why)}</div>` : ''}
        </div>`;
    }).join('');
    return `
      <div style="margin-bottom:10px;">
        <span class="badge ${openedCount === dr.blocks.length ? 'badge-ok' : 'badge-indigo'}">Blocchi ispezionati: ${openedCount}/${dr.blocks.length}</span>
      </div>
      ${blocksHtml}
    `;
  }

  return '';
}

window.drillSorter = function(day, idx, bucket) {
  const ds = ensureDrillState(day, getDayObj(day).drill);
  ds.picks[idx] = bucket;
  saveState(); render();
};
window.drillScalpel = function(day, idx) {
  const ds = ensureDrillState(day, getDayObj(day).drill);
  ds.cuts[idx] = !ds.cuts[idx];
  saveState(); render();
};
window.drillNominal = function(day, idx, oi) {
  const ds = ensureDrillState(day, getDayObj(day).drill);
  ds.picks[idx] = oi;
  saveState(); render();
};
window.drillHunt = function(day, tokIdx) {
  const d = getDayObj(day);
  const ds = ensureDrillState(day, d.drill);
  const tok = d.drill.tokens[tokIdx];
  if (tok && tok.target) {
    ds.found[tokIdx] = true;
    ds.lastFb = `✓ "${tok.text}" → "${tok.replace}": ${tok.why}`;
    saveState(); render();
  }
};
window.drillOrder = function(day, id) {
  const d = getDayObj(day);
  const ds = ensureDrillState(day, d.drill);
  const expected = d.drill.items[ds.placed.length];
  if (expected && expected.id === id) {
    ds.placed.push(id);
    ds.hint = '';
  } else if (expected) {
    ds.hint = (d.drill.wrongHints && d.drill.wrongHints[expected.id]) || 'Non è questo il passo successivo: rileggi la sequenza logica.';
  }
  saveState(); render();
};
window.drillXray = function(day, id) {
  const ds = ensureDrillState(day, getDayObj(day).drill);
  ds.opened[id] = true;
  saveState(); render();
};
window.resetDrill = function(day) {
  delete STATE.drillState[day];
  saveState(); render();
};

function buildStage3Html(d) {
  const draft = STATE.quizDraft[d.day] || {};
  const res = STATE.quizResults[d.day];
  const totalQ = d.quiz.length;
  const passNeeded = Math.ceil(totalQ * 0.8);

  const quizHtml = d.quiz.map((q, qi) => {
    const picked = res ? res.answers[qi] : draft[qi];
    const optsHtml = q.opts.map((opt, oi) => {
      let cls = '';
      if (res) {
        if (oi === q.ans) cls = 'graded-ok';
        else if (picked === oi && oi !== q.ans) cls = 'graded-bad';
      } else if (picked === oi) {
        cls = 'picked';
      }
      const letter = String.fromCharCode(65 + oi);
      return `<button class="quiz-opt ${cls}" ${res ? 'disabled' : ''} onclick="pickQuizOpt(${d.day}, ${qi}, ${oi})"><strong>${letter}.</strong><span>${escapeHtml(opt)}</span></button>`;
    }).join('');

    const expHtml = res
      ? `<div class="feedback-box ${picked === q.ans ? 'ok' : 'bad'}"><strong>${picked === q.ans ? '✓ Risposta esatta' : '✕ Risposta errata'}</strong> — ${escapeHtml(q.exp)}</div>`
      : '';

    return `
      <div class="quiz-q">
        <p class="quiz-q-title">${qi + 1}. ${escapeHtml(q.q)}</p>
        ${optsHtml}
        ${expHtml}
      </div>`;
  }).join('');

  const answeredCount = Object.keys(draft).length;
  let resultHtml = '';
  if (res) {
    resultHtml = `
      <div class="quiz-result-banner ${res.passed ? 'passed' : 'failed'}">
        <div>
          <div style="font-weight:800;font-size:1.05rem;">${res.passed ? '🏆 Test Superato!' : '⚠️ Quasi! Ripassa e riprova'}</div>
          <div style="font-size:0.88rem;">Punteggio: <strong>${res.score}/${res.total}</strong> (${Math.round((res.score / res.total) * 100)}%) — Soglia richiesta: ${passNeeded}/${totalQ} (80%)</div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="retryQuiz(${d.day})">Ripeti il Test</button>
      </div>`;
  } else {
    resultHtml = `
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:14px;">
        <span style="font-size:0.86rem;color:var(--ink-soft);">Risposte selezionate: <strong>${answeredCount}/${totalQ}</strong> (soglia superamento: ≥ ${passNeeded}/${totalQ})</span>
        <button class="btn btn-primary" id="submitQuizBtn" onclick="submitQuiz(${d.day})" ${answeredCount < totalQ ? 'disabled' : ''}>Verifica il Test (${answeredCount}/${totalQ})</button>
      </div>`;
  }

  return `
    <div class="coach-banner">
      <div class="coach-label">Fase 3A · Palestra Tattile (5 min)</div>
      <p class="coach-text">${escapeHtml(d.drill.title)} — ${escapeHtml(d.drill.mission)}</p>
    </div>

    <div class="card">${buildDrillHtml(d)}</div>

    <div class="coach-banner" style="margin-top:26px;">
      <div class="coach-label">Fase 3B · ${d.day === 29 ? 'Esame Finale Completo (20 Domande · Soglia ≥16/20)' : 'Test Valutato del Giorno (5 Domande · Soglia ≥4/5)'}</div>
      <p class="coach-text">Rispondi a tutte le ${totalQ} domande per verificare la padronanza e sbloccare il badge «Test Superato».</p>
    </div>

    ${quizHtml}
    ${resultHtml}

    <div class="stage-footer">
      <button class="btn btn-secondary" onclick="setStage(2)">← Fase 2: Anti-Ispanismi</button>
      <button class="btn btn-primary" onclick="setStage(4)">Vai alla Fase 4: Scrittura Guidata →</button>
    </div>
  `;
}

window.pickQuizOpt = function(day, qIdx, optIdx) {
  if (STATE.quizResults[day]) return;
  if (!STATE.quizDraft[day]) STATE.quizDraft[day] = {};
  STATE.quizDraft[day][qIdx] = optIdx;
  saveState();
  render();
};

window.submitQuiz = function(day) {
  const d = getDayObj(day);
  const draft = STATE.quizDraft[day] || {};
  let score = 0;
  d.quiz.forEach((q, i) => { if (draft[i] === q.ans) score++; });
  const total = d.quiz.length;
  const passed = score >= Math.ceil(total * 0.8);
  STATE.quizResults[day] = { score, total, passed, answers: Object.assign({}, draft) };
  saveState();
  render();
  showToast(passed ? `Test superato: ${score}/${total}!` : `Punteggio ${score}/${total}: riprova per raggiungere l'80%.`);
};

window.retryQuiz = function(day) {
  delete STATE.quizResults[day];
  delete STATE.quizDraft[day];
  saveState();
  render();
};

window.toggleFocusTimer = function(day) {
  if (TIMER_RUNNING) {
    stopTimer();
  } else {
    TIMER_RUNNING = true;
    TIMER_INTERVAL = setInterval(() => {
      TIMER_REMAINING = Math.max(0, TIMER_REMAINING - 1);
      const disp = document.getElementById('timerDisplay');
      if (disp) disp.textContent = formatMMSS(TIMER_REMAINING);
      if (TIMER_REMAINING <= 0) {
        stopTimer();
        showToast('Tempo scaduto! Esegui ora la revisione finale.');
        const btn = document.getElementById('timerToggleBtn');
        if (btn) btn.textContent = '▶ Avvia Timer';
      }
    }, 1000);
  }
  const btn = document.getElementById('timerToggleBtn');
  if (btn) btn.textContent = TIMER_RUNNING ? '⏸ Pausa' : '▶ Avvia Timer';
};

window.resetFocusTimer = function(day) {
  resetTimerForDay(getDayObj(day));
  const disp = document.getElementById('timerDisplay');
  const btn = document.getElementById('timerToggleBtn');
  if (disp) disp.textContent = formatMMSS(TIMER_REMAINING);
  if (btn) btn.textContent = '▶ Avvia Timer';
};

window.onStage4Input = function(day, value) {
  STATE.writingDrafts[day] = value;
  saveState();
  refreshStage4Live(getDayObj(day));
};

window.clearStage4Draft = function(day) {
  STATE.writingDrafts[day] = '';
  saveState();
  const ta = document.getElementById('stage4Textarea');
  if (ta) ta.value = '';
  refreshStage4Live(getDayObj(day));
};

window.copyTutorAi = function(day) {

window.setRubricStar = function(day, key, stars) {

window.toggleCompleteDay = function(day) {

function buildLiveDiagnosticsHtml(a, minWords) {
  const findingsHtml = a.findings.length
    ? `<div class="findings-list">${a.findings.slice(0, 10).map(f => {
        const tag = f.type === 'es' ? '🟣 ISPANISMO' : (f.type === 'acut' ? '🔴 ACUTEZZA' : (f.type === 'nom' ? '🟠 NOMINALIZZAZIONE' : (f.type === 'typo' ? '🩷 REFUSO' : '🟡 BUROCRATESE')));
        return `<div class="finding-item ${f.type === 'es' ? 'es' : ''}">
          <strong>${tag}:</strong> «${escapeHtml(f.match)}» (${f.count}×)
          ${f.suggestion ? ` → <strong>Usa:</strong> ${escapeHtml(f.suggestion)}` : ''}
          ${f.reason ? `<div style="font-size:0.8rem;opacity:0.9;margin-top:2px;">${escapeHtml(f.reason)}</div>` : ''}
        </div>`;
      }).join('')}</div>`
    : (a.words > 0 ? `<div class="feedback-box ok" style="margin-top:10px;">✓ Nessun ispanismo, burocratese, nominalizzazione o aggettivo polemico rilevato!</div>` : '');

  return `
    <div class="telemetry-grid">
      <div class="tel-cell ${minWords && a.words >= minWords ? 'good' : ''}">
        <div class="tel-val">${a.words}${minWords ? '/' + minWords : ''}</div>
        <div class="tel-lbl">Parole</div>
      </div>
      <div class="tel-cell">
        <div class="tel-val">${a.charsNoSpaces.toLocaleString('it-IT')}</div>
        <div class="tel-lbl">Caratt. D.M. 110</div>
      </div>
      <div class="tel-cell ${a.avgTone}">
        <div class="tel-val">${a.avgWords || '—'}</div>
        <div class="tel-lbl">Media/Frase (≤25)</div>
      </div>
      <div class="tel-cell ${a.gulpeaseTone}">
        <div class="tel-val">${a.gulpease || '—'}</div>
        <div class="tel-lbl">Gulpease (≥48)</div>
      </div>
      <div class="tel-cell ${a.spanishCount > 0 ? 'es-hit' : (a.words > 0 ? 'good' : '')}">
        <div class="tel-val">${a.spanishCount}</div>
        <div class="tel-lbl">🟣 Ispanismi</div>
      </div>
      <div class="tel-cell ${a.buroCount > 0 ? 'warn' : ''}">
        <div class="tel-val">${a.buroCount}</div>
        <div class="tel-lbl">Burocratese</div>
      </div>
      <div class="tel-cell ${a.nomCount > 0 ? 'warn' : ''}">
        <div class="tel-val">${a.nomCount}</div>
        <div class="tel-lbl">Nominalizz.</div>
      </div>
      <div class="tel-cell ${a.acutCount > 0 ? 'bad' : ''}">
        <div class="tel-val">${a.acutCount}</div>
        <div class="tel-lbl">Polemici</div>
      </div>
    </div>

    <div class="preview-box">${a.highlightedHtml}</div>
    ${findingsHtml}
  `;
}

function refreshStage4Live(d) {
  const txt = STATE.writingDrafts[d.day] || '';
  const a = analyzeLegalText(txt);
  const liveEl = document.getElementById('stage4LiveArea');
  if (liveEl) liveEl.innerHTML = buildLiveDiagnosticsHtml(a, d.writing.minWords);

  const modelEl = document.getElementById('stage4ModelArea');
  if (!modelEl) return;

  if (a.words < d.writing.minWords) {
    const missing = d.writing.minWords - a.words;
    modelEl.innerHTML = `
      <div class="locked-box">
        <div style="font-size:1.3rem;margin-bottom:6px;">🔒 Soluzione Modello Bloccata</div>
        Scrivi ancora <strong>${missing} parole</strong> (minimo ${d.writing.minWords}) per sbloccare il <strong>Modello Forense Commentato</strong> e la <strong>Rubrica di Autovalutazione a 4 Criteri</strong>.
      </div>`;
  } else {
    const rub = STATE.rubricScores[d.day] || {};
    const rubRows = RUBRIC_CRITERIA.map(c => {
      const val = rub[c.key] || 0;
      const stars = [1, 2, 3, 4, 5].map(n =>
        `<button class="star-btn ${val >= n ? 'on' : ''}" onclick="setRubricStar(${d.day}, '${c.key}', ${n})" aria-label="${n} stelle">★</button>`
      ).join('');
      return `
        <div class="rubric-row">
          <div>
            <div style="font-weight:700;font-size:0.9rem;">${escapeHtml(c.label)}</div>
            <div style="font-size:0.78rem;color:var(--ink-muted);">${escapeHtml(c.desc)}</div>
          </div>
          <div class="star-group">${stars}</div>
        </div>`;
    }).join('');

    const vals = Object.values(rub).filter(v => v > 0);
    const avgStar = vals.length ? (vals.reduce((s, x) => s + x, 0) / vals.length).toFixed(1) : '—';

    modelEl.innerHTML = `
      <div class="model-box">
        <div class="eyebrow" style="color:var(--ok);">🔓 Soluzione Modello Sbloccata</div>
        <div class="example-text" style="margin-bottom:14px;">${escapeHtml(d.writing.modelSolution)}</div>
        <div class="feedback-box ok"><strong>Perché funziona:</strong> ${escapeHtml(d.writing.rationale)}</div>
      </div>

      <div class="rubric-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h3 style="margin:0;">Autovalutazione Guidata (1–5 stelle)</h3>
          <span class="badge badge-indigo">Media: ${avgStar}/5</span>
        </div>
        ${rubRows}
      </div>`;
  }
}

window.selectJournalDay = function(day) {

  saveState(); render();
};
window.saveJournalNote = function(day, text) {

};
window.exportBackupJson = function() {
  const payload = JSON.stringify({ exportedAt: new Date().toISOString(), app: 'ScritturaGiuridicaPraticaV3', state: STATE }, null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `scrittura-giuridica-30giorni-backup.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup .json esportato!');
};
window.importBackupJson = function(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const imported = parsed.state || parsed;
      STATE = Object.assign(defaultState(), imported);
      saveState();
      render();
      showToast('Backup importato con successo!');
    } catch (e) {
      showToast('File JSON non valido.');
    }
  };
  reader.readAsText(file);
};
window.resetAllProgress = function() {
  if (!confirm('Vuoi davvero azzerare tutti i progressi locali?')) return;
  STATE = defaultState();
  saveState();
  render();
  showToast('Progressi azzerati.');
};

function buildUploadSubHtml() {
  const customCount = (STATE.customActs || []).length;
  return `

      <h2>Carica Nuovo Atto Reale (con Pre-Filtro Privacy GDPR)</h2>
      <p style="margin:0 0 14px;font-size:0.88rem;color:var(--ink-soft);">Espandi la tua palestra nel tempo caricando file <code>.txt</code> / <code>.md</code> o incollando un atto. Prima del salvataggio locale, lo scanner client-side individua automaticamente <strong>Codici Fiscali, Email/PEC, Telefoni, Date di nascita e IBAN</strong>.</p>

      <div style="display:grid;gap:10px;margin-bottom:12px;">
        <input id="upTitle" class="input-field" placeholder="Titolo dell'atto (es. Memoria difensiva TAR — Appalti)">

          <input type="file" accept=".txt,.md" style="display:none;" onchange="handleUploadFile(event)">
        </label>
        <textarea id="upText" class="writing-area" placeholder="Incolla qui il testo del nuovo atto..." oninput="runUploadPrivacyScan()"></textarea>
      </div>

      <div id="upPrivacyBox"></div>

      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;">
        <button class="btn btn-secondary btn-sm" id="redactBtn" onclick="applyUploadRedaction()">🛡️ Oscura automaticamente dati sensibili (GDPR)</button>
        <button class="btn btn-primary btn-sm" onclick="saveUploadedAct()">Salva nell'Archivio Locale (${customCount} personali)</button>
      </div>
    </div>
  `;
}

window.handleUploadFile = function(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const tEl = document.getElementById('upTitle');
    const bEl = document.getElementById('upText');
    if (tEl && !tEl.value) tEl.value = file.name.replace(/\.(txt|md)$/i, '');
    if (bEl) bEl.value = reader.result;
    runUploadPrivacyScan();
  };
  reader.readAsText(file);
};

window.runUploadPrivacyScan = function() {
  const txt = document.getElementById('upText')?.value || '';
  const box = document.getElementById('upPrivacyBox');
  if (!box) return;
  if (!txt.trim()) { box.innerHTML = ''; return; }
  const risks = scanPrivacyRisks(txt);
  if (risks.length === 0) {
    box.innerHTML = `<div class="feedback-box ok">✓ Pre-Filtro GDPR: nessun dato sensibile strutturato (CF, Email, Telefono, IBAN, Data di nascita) rilevato.</div>`;
  } else {
    const list = risks.map(r => `<li><strong>${escapeHtml(r.type)}:</strong> ${r.matches.map(escapeHtml).join(', ')}</li>`).join('');
    box.innerHTML = `<div class="feedback-box bad"><strong>⚠️ Rilevati possibili dati personali reali (GDPR):</strong><ul style="margin:6px 0 0;padding-left:18px;">${list}</ul>Clicca «Oscura automaticamente dati sensibili» prima di salvare.</div>`;
  }
};

window.applyUploadRedaction = function() {
  const ta = document.getElementById('upText');
  if (!ta || !ta.value.trim()) { showToast('Incolla prima un testo da anonimizzare.'); return; }
  ta.value = redactPrivacyRisks(ta.value);
  runUploadPrivacyScan();
  showToast('Dati sensibili oscurati con [OMISSIS]!');
};

window.saveUploadedAct = function() {
  const title = (document.getElementById('upTitle')?.value || '').trim();
  const area = (document.getElementById('upArea')?.value || '').trim() || 'Personale';
  const text = (document.getElementById('upText')?.value || '').trim();
  if (!title || text.length < 40) {
    showToast('Inserisci un titolo e almeno 40 caratteri di testo.');
    return;
  }
  const risks = scanPrivacyRisks(text);
  if (risks.length > 0) {
    showToast('Oscura prima i dati personali rilevati dal Pre-Filtro GDPR!');
    runUploadPrivacyScan();
    return;
  }
  const newAct = {
    id: 'user_' + Date.now(),
    code: 'USER_ACT',
    genre: area,
    title,
    subtitle: 'Atto caricato dall’utente (anonimizzato GDPR) con scheletro generato automaticamente.',
    text,
    template: generateAutoSkeleton(text, title, area),
    annotations: []
  };
  STATE.customActs.push(newAct);
  saveState();
  STATE.toolsSub = 'atti';
  render();
  showToast('Atto salvato nell’Archivio Locale!');
};

// --- 3.4 BIBLIOTECA FONTI UFFICIALI (11) + D.M. 110 + TOP 30 ISPANISMI ---
function buildSourcesSubHtml() {
  const sourcesList = OFFICIAL_SOURCES.map((s, i) => `
    <div class="source-callout" style="margin-top:0;margin-bottom:10px;background:#fff;">
      <div style="flex:1;min-width:220px;">
        <div style="font-size:0.72rem;font-weight:800;color:var(--accent);text-transform:uppercase;">${i + 1}. ${escapeHtml(s.org)}</div>
        <div style="font-weight:700;font-size:0.92rem;">${escapeHtml(s.title)}</div>
        <div style="font-size:0.82rem;color:var(--ink-soft);margin-top:2px;">${escapeHtml(s.desc)}</div>
      </div>
      <a class="btn btn-secondary btn-sm" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">Apri ↗</a>
    </div>`).join('');

  const cats = ['Tutti', ...new Set(SPANISHISMS_DICT.map(x => x.cat))];
  const curCat = STATE.esFilterCat || 'Tutti';
  const filteredEs = curCat === 'Tutti' ? SPANISHISMS_DICT : SPANISHISMS_DICT.filter(x => x.cat === curCat);

  const esRows = filteredEs.map((r, i) => `
    <tr>
      <td><strong>${i + 1}.</strong> <span class="badge badge-es">${escapeHtml(r.cat)}</span><br><span style="font-size:0.78rem;color:var(--ink-muted);">${escapeHtml(r.es)}</span></td>
      <td style="color:var(--bad);text-decoration:line-through;">${escapeHtml(r.err)}</td>
      <td style="color:var(--ok);font-weight:700;">${escapeHtml(r.ok)}<div style="font-weight:400;color:var(--ink-soft);font-size:0.78rem;margin-top:3px;">${escapeHtml(r.note)}</div></td>
    </tr>`).join('');

  return `
    <div class="card">
      <h2>Biblioteca delle 11 Fonti Ufficiali (Link Diretti)</h2>
      ${sourcesList}
    </div>

    <div class="card-white">
      <h2>Prontuario Rapido: D.M. 110/2023 · Cassazione · TAR/CdS</h2>
      <div class="table-wrap">
        <table class="ref-table">
          <thead><tr><th>Rito / Fonte</th><th>Limiti Dimensionali</th><th>Grafica &amp; Note</th><th>Sanzioni / Premi</th></tr></thead>
          <tbody>
            <tr><td><strong>Civile</strong><br>D.M. 110/2023 (cause &lt; €500k)</td><td>80k introduttivi/conclusionali; 50k memorie/repliche; 10k note 127-ter (spazi esclusi)</td><td>12 pt, interlinea 1,5, margini 2,5 cm; note solo per giurisprudenza/dottrina</td><td>Spese di lite, art. 96 co. 3, inammissibilità se incomprensibile; +30% compensi per link doc. 001 ss.</td></tr>
            <tr><td><strong>Cassazione Civile</strong><br>Protocollo 1° mar. 2023</td><td>Max 30 pp. ricorso/controricorso; max 15 pp. memorie illustrative</td><td>12 pt, interlinea 1,5, margini 2,5 cm; max 10 parole chiave + sintesi preliminare</td><td>Autosufficienza e specifica indicazione atti/documenti</td></tr>
            <tr><td><strong>Amministrativo</strong><br>D.P.C.S. 167/2016 &amp; art. 13-ter c.p.a.</td><td>70k caratteri (~35 pp.) ordinario/appalti/elettorale; 10–20k repliche</td><td>Font 14 pt; <strong>note a piè di pagina VIETATE</strong></td><td>Autorizzazione presidenziale per deroga; omesso esame eccedenza non impugnabile</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card-white">
      <h2>🟣 Prontuario Completo: Top 30 Interferenze Spagnolo → Italiano Giuridico</h2>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
        ${cats.map(c => `<button class="btn btn-sm ${curCat === c ? 'btn-es' : 'btn-secondary'}" onclick="setEsCat('${escapeHtml(c)}')">${escapeHtml(c)}</button>`).join('')}
      </div>
      <div class="table-wrap">
        <table class="ref-table">
          <thead><tr><th>Origine Spagnola</th><th>Errore / Calco (Evitare)</th><th>Italiano Forense Corretto</th></tr></thead>
          <tbody>${esRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

window.setEsCat = function(cat) {
  STATE.esFilterCat = cat;
  saveState(); render();
};

// =========================================================================
// BOOTSTRAP
// =========================================================================
document.addEventListener('DOMContentLoaded', () => {
  render();
});

  </script>
</body>
