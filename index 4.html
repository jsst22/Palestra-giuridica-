<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Scrittura Giuridica Pratica — Corso Completo in 30 Giorni (D.M. 110/2023)</title>
  <style>
/* =========================================================================
   SCRITTURA GIURIDICA PRATICA — CORSO COMPLETO IN 30 GIORNI (V3)
   FutureLearn Editorial Aesthetic · Single-Column iPad Touch UX
   ========================================================================= */

:root {
  --bg: #FFFFFF;
  --surface: #F6F7F9;
  --surface-2: #EEF1F6;
  --border: #E2E6EE;
  --border-strong: #CBD3E1;
  --ink: #1E2328;
  --ink-soft: #4A5462;
  --ink-muted: #6C7685;

  /* FutureLearn-style single primary accent: Deep Indigo */
  --accent: #2B3A67;
  --accent-hover: #1E2A4D;
  --accent-soft: #EEF2FF;
  --accent-border: #C7D2FE;

  /* Semantic accents */
  --ok: #15803D;
  --ok-bg: #ECFDF3;
  --ok-border: #A7F3D0;

  --warn: #B45309;
  --warn-bg: #FFFBEB;
  --warn-border: #FDE68A;

  --bad: #B91C1C;
  --bad-bg: #FEF2F2;
  --bad-border: #FECACA;

  /* Dedicated Purple for Radar Anti-Ispanismi */
  --es: #7E22CE;
  --es-dark: #581C87;
  --es-bg: #F5F0FF;
  --es-border: #D8B4FE;

  --radius: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 2px 8px rgba(30, 35, 40, 0.05);
  --shadow-md: 0 6px 24px rgba(30, 35, 40, 0.07);

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  font-size: 18px;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

img, svg {
  max-width: 100%;
  height: auto;
  display: block;
}

a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a:hover { color: var(--accent-hover); }

button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
}

/* =========================================================================
   TOP NAVIGATION BAR (STRICTLY 3 TABS)
   ========================================================================= */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  max-width: 780px;
  margin: 0 auto;
  padding: 12px 20px 0;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--ink);
  cursor: pointer;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

.brand-title {
  font-weight: 800;
  font-size: 0.98rem;
  line-height: 1.2;
  letter-spacing: -0.015em;
}

.brand-sub {
  font-size: 0.72rem;
  color: var(--ink-muted);
  font-weight: 500;
}

.top-pill {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
}

.nav-tabs {
  display: flex;
  gap: 6px;
}

.nav-tab {
  flex: 1;
  min-height: 48px;
  padding: 10px 12px 12px;
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  color: var(--ink-soft);
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  text-align: center;
}

.nav-tab:hover {
  color: var(--accent);
  background: var(--surface);
  border-radius: 8px 8px 0 0;
}

.nav-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* =========================================================================
   MAIN SINGLE-COLUMN CONTAINER
   ========================================================================= */
.container {
  max-width: 740px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}

/* =========================================================================
   BUTTONS & TOUCH TARGETS (MIN 48PX)
   ========================================================================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 11px 20px;
  border-radius: var(--radius-sm);
  border: 1.5px solid transparent;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  transition: transform 0.08s ease, background 0.15s, border-color 0.15s, color 0.15s;
  text-decoration: none;
  line-height: 1.3;
}
.btn:active { transform: scale(0.985); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

.btn-secondary {
  background: #fff;
  color: var(--ink);
  border-color: var(--border-strong);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--surface);
  border-color: var(--accent);
  color: var(--accent);
}

.btn-es {
  background: var(--es);
  color: #fff;
}
.btn-es:hover:not(:disabled) { background: var(--es-dark); }

.btn-ok {
  background: var(--ok);
  color: #fff;
}
.btn-ok:hover:not(:disabled) { background: #166534; }

.btn-ghost {
  background: transparent;
  color: var(--accent);
  border-color: transparent;
  padding: 10px 14px;
}
.btn-ghost:hover { background: var(--accent-soft); }

.btn-sm {
  min-height: 42px;
  padding: 8px 14px;
  font-size: 0.84rem;
}

.btn-block { width: 100%; }

/* =========================================================================
   HERO & COURSE MAP (TAB 1: IL CORSO)
   ========================================================================= */
.hero-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px 26px;
  margin-bottom: 28px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--accent);
  margin-bottom: 8px;
}

.hero-card h1 {
  margin: 0 0 10px;
  font-size: 1.65rem;
  line-height: 1.22;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.hero-lead {
  margin: 0 0 20px;
  color: var(--ink-soft);
  font-size: 0.96rem;
}

.progress-wrap {
  margin: 16px 0 20px;
}

.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink-soft);
  margin-bottom: 8px;
}

.progress-track {
  width: 100%;
  height: 10px;
  background: #DFE4EE;
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.3s ease;
}

.progress-fill.ok { background: var(--ok); }
.progress-fill.es { background: var(--es); }

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.hero-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.info-chip {
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--ink-soft);
  background: #fff;
  border: 1px solid var(--border);
  padding: 5px 11px;
  border-radius: 999px;
}
.info-chip.es {
  color: var(--es);
  background: var(--es-bg);
  border-color: var(--es-border);
}

/* Week Editorial Cards */
.week-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.week-cover {
  width: 100%;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}

.week-cover svg {
  width: 100%;
  height: auto;
  display: block;
}

.week-head {
  padding: 20px 22px 14px;
}

.week-head-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.week-badge {
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
}

.week-count {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink-muted);
}

.week-title {
  margin: 0 0 6px;
  font-size: 1.22rem;
  line-height: 1.3;
  letter-spacing: -0.015em;
}

.week-desc {
  margin: 0 0 12px;
  font-size: 0.88rem;
  color: var(--ink-soft);
}

.day-list {
  border-top: 1px solid var(--border);
}

.day-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 22px;
  background: #fff;
  border: none;
  border-bottom: 1px solid var(--border);
  text-align: left;
  cursor: pointer;
  transition: background 0.14s;
  min-height: 62px;
}
.day-row:last-child { border-bottom: none; }
.day-row:hover { background: var(--surface); }

.day-num {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--accent);
  font-weight: 800;
  font-size: 0.84rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1.5px solid var(--border);
}

.day-row.done .day-num {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}

.day-row.current {
  background: var(--accent-soft);
}

.day-row.current .day-num {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.day-body {
  flex: 1;
  min-width: 0;
}

.day-name {
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--ink);
  line-height: 1.35;
}

.day-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
  font-size: 0.74rem;
  color: var(--ink-muted);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
}
.badge-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-border); }
.badge-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
.badge-bad { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-border); }
.badge-es { background: var(--es-bg); color: var(--es); border: 1px solid var(--es-border); }
.badge-indigo { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }

.day-arrow {
  color: var(--ink-muted);
  font-weight: 700;
  font-size: 1rem;
  flex-shrink: 0;
}

/* =========================================================================
   DAILY 4-STAGE RUNNER
   ========================================================================= */
.runner-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.runner-header {
  margin-bottom: 20px;
}

.runner-header h1 {
  margin: 4px 0 6px;
  font-size: 1.48rem;
  line-height: 1.25;
  letter-spacing: -0.02em;
}

.runner-subtitle {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.94rem;
}

/* 4-Stage Stepper */
.stepper {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}

.stage-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 11px 12px;
  min-height: 64px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
}

.stage-btn:hover { border-color: var(--accent); }

.stage-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.stage-btn.stage-es.active {
  background: var(--es);
  border-color: var(--es);
  color: #fff;
}

.stage-btn.completed:not(.active) {
  background: var(--ok-bg);
  border-color: var(--ok-border);
}

.stage-kicker {
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.8;
}

.stage-label {
  font-size: 0.8rem;
  font-weight: 700;
  line-height: 1.25;
}

/* Coach Mission Banner */
.coach-banner {
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  border-left: 5px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 15px 18px;
  margin-bottom: 22px;
}

.coach-banner.es-theme {
  background: var(--es-bg);
  border-color: var(--es-border);
  border-left-color: var(--es);
}

.coach-label {
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--accent);
  margin-bottom: 4px;
}

.coach-banner.es-theme .coach-label { color: var(--es); }

.coach-text {
  margin: 0;
  font-size: 0.94rem;
  font-weight: 600;
  color: var(--ink);
}

/* Editorial Cards inside Stages */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 20px;
}

.card-white {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}

.card h2, .card-white h2 {
  margin: 0 0 12px;
  font-size: 1.15rem;
  line-height: 1.3;
}

.card h3, .card-white h3 {
  margin: 0 0 10px;
  font-size: 1rem;
  line-height: 1.35;
}

.infographic-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.infographic-box svg {
  width: 100%;
  height: auto;
}

.lesson-points {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.lesson-points li {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px 18px;
  font-size: 0.96rem;
  line-height: 1.68;
}

.lesson-points code {
  background: var(--surface-2);
  padding: 2px 6px;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 0.86em;
  color: var(--accent);
}

.example-box {
  background: #FAFBFD;
  border: 1px solid var(--border-strong);
  border-left: 4px solid var(--accent);
  border-radius: 12px;
  padding: 18px 20px;
  margin: 20px 0;
}

.example-label {
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin-bottom: 8px;
}

.example-text {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 0.98rem;
  line-height: 1.72;
  white-space: pre-line;
  color: var(--ink);
}

.source-callout {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
  margin-top: 18px;
  font-size: 0.86rem;
}

/* =========================================================================
   STAGE 2: RADAR ANTI-ISPANISMI (PURPLE IDENTITY)
   ========================================================================= */
.es-card {
  background: #fff;
  border: 1.5px solid var(--es-border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}

.es-trap-pill {
  display: inline-block;
  background: var(--es-bg);
  color: var(--es-dark);
  border: 1px solid var(--es-border);
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.wrong-sentence {
  background: #FEF2F2;
  border: 1px dashed #FCA5A5;
  border-radius: 10px;
  padding: 13px 16px;
  font-family: var(--font-serif);
  font-size: 0.98rem;
  color: #7F1D1D;
  margin-bottom: 14px;
}

.choice-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.choice-btn {
  width: 100%;
  min-height: 52px;
  padding: 13px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 11px;
  text-align: left;
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.14s;
}
.choice-btn:hover { border-color: var(--accent); background: #fff; }
.choice-btn.selected-ok {
  background: var(--ok-bg);
  border-color: var(--ok);
  color: #14532D;
  font-weight: 600;
}
.choice-btn.selected-bad {
  background: var(--bad-bg);
  border-color: var(--bad);
  color: #7F1D1D;
}

.feedback-box {
  margin-top: 12px;
  padding: 12px 15px;
  border-radius: 10px;
  font-size: 0.88rem;
  line-height: 1.55;
}
.feedback-box.ok { background: var(--ok-bg); color: #14532D; border: 1px solid var(--ok-border); }
.feedback-box.bad { background: var(--bad-bg); color: #7F1D1D; border: 1px solid var(--bad-border); }
.feedback-box.es { background: var(--es-bg); color: var(--es-dark); border: 1px solid var(--es-border); }

/* =========================================================================
   STAGE 3: 6 TACTILE DRILL TYPES + GRADED QUIZ
   ========================================================================= */
.sorter-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.sorter-term {
  font-weight: 700;
  font-size: 0.96rem;
  margin-bottom: 10px;
}
.sorter-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* Scalpel */
.scalpel-doc {
  background: #fff;
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 20px;
  font-family: var(--font-serif);
  font-size: 1.02rem;
  line-height: 1.9;
  margin-bottom: 14px;
}
.cut-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin: 0 4px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1.5px dashed var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--font-sans);
  font-size: 0.78rem;
  font-weight: 800;
  cursor: pointer;
  vertical-align: middle;
}
.cut-chip.done {
  border-style: solid;
  border-color: var(--ok);
  background: var(--ok-bg);
  color: var(--ok);
}

/* Hunt */
.hunt-box {
  background: #fff;
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 20px;
  font-family: var(--font-serif);
  font-size: 1.02rem;
  line-height: 1.95;
  margin-bottom: 14px;
}
.hunt-tok {
  display: inline;
  padding: 2px 5px;
  border-radius: 6px;
  cursor: pointer;
  border-bottom: 1.5px dotted var(--border-strong);
  transition: background 0.14s;
}
.hunt-tok:hover { background: var(--accent-soft); }
.hunt-tok.found {
  background: var(--ok-bg);
  color: var(--ok);
  border-bottom: 2px solid var(--ok);
  font-weight: 700;
}
.hunt-tok.found-es {
  background: var(--es-bg);
  color: var(--es-dark);
  border-bottom: 2px solid var(--es);
  font-weight: 700;
}
.hunt-tok.miss {
  background: var(--warn-bg);
}

/* Order */
.order-timeline {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.order-slot {
  padding: 12px 15px;
  border-radius: 10px;
  background: var(--ok-bg);
  border: 1px solid var(--ok-border);
  font-size: 0.9rem;
  font-weight: 600;
  color: #14532D;
}
.order-pool {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

/* X-ray */
.xray-block {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.xray-block:hover { border-color: var(--accent); }
.xray-block.opened {
  border-color: var(--ok);
  background: #FCFFFD;
}
.xray-tag {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 3px 9px;
  border-radius: 6px;
  margin-bottom: 8px;
}
.xray-text {
  font-family: var(--font-serif);
  font-size: 0.96rem;
  white-space: pre-line;
  margin: 0;
}

/* Quiz Section */
.quiz-q {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}
.quiz-q-title {
  font-weight: 700;
  font-size: 0.96rem;
  margin: 0 0 12px;
  color: var(--ink);
}
.quiz-opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 11px 14px;
  margin-bottom: 8px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  text-align: left;
  font-size: 0.9rem;
  color: var(--ink);
  cursor: pointer;
  line-height: 1.45;
}
.quiz-opt:hover { border-color: var(--accent); background: #fff; }
.quiz-opt.picked {
  border-color: var(--accent);
  background: var(--accent-soft);
  font-weight: 600;
}
.quiz-opt.graded-ok {
  border-color: var(--ok);
  background: var(--ok-bg);
  color: #14532D;
  font-weight: 600;
}
.quiz-opt.graded-bad {
  border-color: var(--bad);
  background: var(--bad-bg);
  color: #7F1D1D;
}

.quiz-result-banner {
  padding: 20px;
  border-radius: 14px;
  margin: 18px 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
}
.quiz-result-banner.passed {
  background: var(--ok-bg);
  border: 1.5px solid var(--ok);
  color: #14532D;
}
.quiz-result-banner.failed {
  background: var(--warn-bg);
  border: 1.5px solid var(--warn);
  color: #78350F;
}

/* =========================================================================
   STAGE 4: WRITING STUDIO, LIVE TELEMETRY, PURPLE SPANISHISMS & RUBRIC
   ========================================================================= */
.timer-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 16px;
}
.timer-readout {
  font-family: var(--font-mono);
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--accent);
}

.writing-area {
  width: 100%;
  min-height: 220px;
  padding: 18px;
  border: 1.5px solid var(--border-strong);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 1.02rem;
  line-height: 1.72;
  resize: vertical;
}
.writing-area:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(43, 58, 103, 0.14);
}

/* Compact Clean Telemetry Strip */
.telemetry-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 14px 0;
}

.tel-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  text-align: center;
}
.tel-cell.good { background: var(--ok-bg); border-color: var(--ok-border); }
.tel-cell.warn { background: var(--warn-bg); border-color: var(--warn-border); }
.tel-cell.bad { background: var(--bad-bg); border-color: var(--bad-border); }
.tel-cell.es-hit { background: var(--es-bg); border-color: var(--es); }

.tel-val {
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1.2;
  color: var(--ink);
}
.tel-cell.good .tel-val { color: var(--ok); }
.tel-cell.warn .tel-val { color: var(--warn); }
.tel-cell.bad .tel-val { color: var(--bad); }
.tel-cell.es-hit .tel-val { color: var(--es); }

.tel-lbl {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-top: 3px;
}

/* Live Diagnostic Highlight Preview */
.preview-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  font-family: var(--font-serif);
  font-size: 0.96rem;
  line-height: 1.85;
  margin: 12px 0;
}

.sent-warn { background: #FEF3C7; border-radius: 4px; padding: 1px 2px; }
.sent-bad  { background: #FEE2E2; border-radius: 4px; padding: 1px 2px; }

.tok-es   { background: var(--es-bg); color: var(--es-dark); border-bottom: 2.5px solid var(--es); padding: 1px 4px; border-radius: 4px; font-weight: 700; }
.tok-buro { background: #FEF3C7; color: #92400E; border-bottom: 2px solid #D97706; padding: 1px 3px; border-radius: 4px; }
.tok-nom  { background: #FFEDD5; color: #9A3412; border-bottom: 2px solid #EA580C; padding: 1px 3px; border-radius: 4px; }
.tok-acut { background: #FEE2E2; color: #991B1B; border-bottom: 2px solid #DC2626; padding: 1px 3px; border-radius: 4px; }
.tok-typo { background: #FCE7F3; color: #9D174D; border-bottom: 2px solid #DB2777; padding: 1px 3px; border-radius: 4px; }

.findings-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}

.finding-item {
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 0.84rem;
  line-height: 1.5;
  background: var(--surface);
  border: 1px solid var(--border);
}
.finding-item.es {
  background: var(--es-bg);
  border-color: var(--es-border);
  color: var(--es-dark);
}

/* Locked Model Solution + 4-Criteria 1-5 Star Rubric */
.locked-box {
  background: var(--surface);
  border: 1.5px dashed var(--border-strong);
  border-radius: 14px;
  padding: 20px;
  text-align: center;
  margin: 18px 0;
  color: var(--ink-soft);
  font-size: 0.92rem;
}

.model-box {
  background: #FAFBFD;
  border: 1.5px solid var(--ok-border);
  border-radius: 14px;
  padding: 22px;
  margin: 18px 0;
}

.rubric-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin: 18px 0;
}

.rubric-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.rubric-row:last-child { border-bottom: none; }

.star-group {
  display: flex;
  gap: 6px;
}

.star-btn {
  width: 42px;
  height: 42px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 1.05rem;
  cursor: pointer;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.star-btn.on {
  background: #FEF3C7;
  border-color: #D97706;
  color: #B45309;
}

/* =========================================================================
   STAGE FOOTER NAV
   ========================================================================= */
.stage-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

/* =========================================================================

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 22px;

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 14px;
  text-align: center;
}
.stat-num {
  font-size: 1.55rem;
  font-weight: 800;
  color: var(--accent);
  line-height: 1.15;
}
.stat-lbl {
  font-size: 0.76rem;
  color: var(--ink-muted);
  font-weight: 700;
  margin-top: 5px;
}

.subnav-pills {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 22px;
}
.subnav-pill {
  min-height: 52px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.86rem;
  cursor: pointer;
  text-align: left;

}
.subnav-pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.lookup-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.input-field {
  width: 100%;
  min-height: 48px;
  padding: 11px 14px;
  border: 1.5px solid var(--border-strong);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  font-size: 0.94rem;
}

.dm-bar-wrap {
  margin: 14px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
}

.act-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.act-card.anchor {
  border: 2px solid var(--accent);
  background: #FAFBFD;
}
.act-fulltext {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  font-family: var(--font-serif);
  font-size: 0.92rem;
  line-height: 1.72;
  white-space: pre-wrap;
  max-height: 460px;
  overflow-y: auto;
  margin-top: 12px;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-top: 12px;
}
table.ref-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.84rem;
  background: #fff;
}
table.ref-table th, table.ref-table td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}
table.ref-table th {
  background: var(--surface);
  font-weight: 800;
  color: var(--ink);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
table.ref-table tr:last-child td { border-bottom: none; }

.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: var(--ink);
  color: #fff;
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 0.88rem;
  font-weight: 700;
  box-shadow: var(--shadow-md);
  z-index: 200;
  transition: transform 0.25s ease;
  pointer-events: none;
  max-width: 90vw;
  text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }

  .sorter-actions { grid-template-columns: 1fr; }
  .subnav-pills { grid-template-columns: 1fr; }
  .brand-sub { display: none; }

    "summaryNote": "Intestazione chiara, Sommario iniziale, In Fatto cronologico con (doc. 01–08), In Diritto in 4 capi progressivi (punto debole per primo → radicamento → art. 9 TUI + Consiglio di Stato → bilanciamento Cass. SS.UU.), Conclusioni nette ed Elenco Allegati speculare.",
    "text": "[Città], data come da messaggio P.E.C.\n\nSpett.le Questura di [Città] Ufficio immigrazione A mezzo P.E.C.: [pec-questura@omissis]\n\nOggetto: Comunicazione di avvio procedimento amministrativo ai sensi dell’art. 7, legge 7 agosto 1990, n. 241 – Memoria difensiva nell’interesse del sig. Tizio\n\nIl sottoscritto Avv. [Difensore 1] del Foro di [Città], C.F. [OMISSIS], che difende, congiuntamente e disgiuntamente all’Avv. [Difensore 2 — Co-redattrice Modello Principale] del Foro di [Città], C.F. [OMISSIS], il sig. Tizio, nato in [Stato estero] il [OMISSIS], residente in [Indirizzo 1], C.F. [OMISSIS], in virtù di procura alle liti depositata telematicamente unitamente al presente atto, con domicilio eletto presso lo studio del primo procuratore, sito in [Indirizzo studio], formula la seguente memoria volta al superamento delle osservazioni rassegnate dalla Questura di [Città], Ufficio Immigrazione, in relazione all’avvio della procedura di revoca della carta di soggiorno per familiari di cittadini UE.\nSommario\n* In Fatto ..................................................................................... pag. 1\n* In Diritto ................................................................................... pag. 2\n   1. Con riferimento ai provvedimenti di condanna\n   2. Con riferimento alla situazione familiare, abitativa e lavorativa\n   3. Con riferimento all’errata valutazione circa la pericolosità sociale del sig. Tizio\n   4. Con riferimento al superiore interesse della figlia del sig. Tizio\n* Conclusioni ................................................................................ pag. 7\n\n________________\n\nIn Fatto\n* Il sig. Tizio, attualmente in custodia cautelare presso la Casa Circondariale di [Città], risulta essere titolare dal [Anno 2012] di una carta di soggiorno per familiari di cittadini UE, in relazione alla quale veniva avanzata richiesta di aggiornamento, tramite Uffici Postali, in data [Data richiesta] (doc. 01);\n* In data [Data notifica] il sig. Tizio si vedeva notificare comunicazione di avvio procedimento amministrativo ai sensi dell’art. 7, legge 7 agosto 1990, n. 241, con la quale la Questura di [Città], Ufficio Immigrazioni, rappresentava al medesimo l’avvio della procedura per la revoca del titolo autorizzatorio alla permanenza in Italia alla luce dei seguenti provvedimenti: [OMISSIS];\n* Nello specifico, nella suddetta comunicazione si rilevava che tali reati, condanne, circostanze, comportamenti e misure applicate costituissero attuali, oggettivi e concreti elementi in base ai quali desumere la pericolosità sociale del sig. Tizio e la sua appartenenza alla categoria di persone abitualmente dedite a traffici delittuosi da cui traggono, anche parzialmente, i mezzi di sostentamento ovvero dedite alla commissione di delitti che offendono o mettono in pericolo la sicurezza e la tranquillità pubblica (doc. 02).\n\n***\nIn Diritto\nLa scrivente difesa ritiene illegittima la procedura di revoca per la carta di soggiorno per familiari di cittadini UE rilasciata al sig. Tizio, in considerazione delle seguenti motivazioni:\n\n1. Con riferimento ai provvedimenti di condanna\n\nCon la sentenza di applicazione della pena tra le parti emessa dal Tribunale di [Città], nella persona della Giudice Dott.ssa [OMISSIS], in data [Data sentenza 1], in seno al procedimento penale R.G.N.R. n. [OMISSIS], per il reato di cui all’art. 385 c.p., vero è che è stata comminata al sig. Tizio una pena di mesi 6 di reclusione, sostituita, però, con una pena pecuniaria pari ad € 1.800,00.\n\nIn relazione alle modalità di pagamento della stessa, con ordinanza n. [OMISSIS], il Magistrato di Sorveglianza di [Città], Dott.ssa [OMISSIS], ammetteva il sig. Tizio al pagamento rateale infruttifero di interesse, disponendo che la somma di € 1.800,00 venisse pagata dal condannato in n. 36 rate mensili di pari importo, ciascuna di € 50,00 (doc. 03).\n\nIl sig. Tizio procedeva, pertanto, al pagamento della prima rata, risc strizione presso la Casa Circondariale di [Città], la quale rappresenta un ostacolo all’inizio del percorso predetto, i servizi sociali stanno tentando di fissare dei colloqui con il sig. Tizio.\n\nIn aggiunta, con decorrenza dalla domanda giudiziale, il Giudice Dott. [OMISSIS] poneva a carico del sig. Tizio l’obbligo di versare alla sig.ra [Ex Compagna], a titolo di contributo al mantenimento della figlia minore, la somma di € 150,00 mensili, annualmente rivalutabile secondo gli indici ISTAT, entro il giorno 5 di ogni mese, oltre il 50% delle spese straordinarie.\n\nDal punto di vista abitativo, malgrado attualmente il sig. Tizio sia in custodia cautelare presso la Casa Circondariale di [Città] e risulti, comunque, residente presso l’abitazione sita in [Indirizzo 1], in cui conviveva con l’ex compagna, lo stesso risulta titolare di un contratto di locazione ad uso abitativo, insieme alla sorella, a lui concesso dalla sig.ra [Locatrice], in relazione all’unità immobiliare posta in [Indirizzo 2] (doc. 06).\n\nDa ultimo, con riguardo alla situazione lavorativa, dal percorso lavoratore allegato alla presente, si evince come il sig. Tizio abbia sempre svolto attività lavorativa a partire dall’anno 2017, ottenendo la trasformazione del contratto a tempo determinato a contratto a tempo indeterminato presso la [Società Datrice S.p.A.], C.F. [OMISSIS], per la mansione di manovale all’assemblaggio meccanico (doc. 07 – doc. 08). Tale contratto è, ad oggi, ancora in essere. Per evidenziare, poi, l’impegno del sig. Tizio, la scrivente difesa vuole porre all’attenzione dell’Amministrazione l’assunzione con contratto a tempo determinato dello stesso presso la Casa Circondariale di [Città] nella mansione, prima, di addetto all’assistenza personale e, poi, di addetto ai servizi di pulizia di uffici ed esercizi commerciali.\n\n3. Con riferimento all’errata valutazione circa la pericolosità sociale del sig. Tizio\n\nNel caso di specie, la Questura di [Città], Ufficio Immigrazione, si è limitata nella propria comunicazione a richiamare le condanne penali, di cui l’ultima, peraltro, non ancora definitiva, senza argomentare in modo adeguato e sufficiente in ordine alla pericolosità del sig. Tizio.\n\nInvero, quest’ultimo risiede in Italia dal 2003, risulta integrato nel tessuto sociale e svolge dal 2017 nel territorio nazionale la propria attività lavorativa.\n\nL’Amministrazione, nella valutazione della pericolosità sociale del cittadino straniero, dovrebbe prendere in considerazione la particolare condizione del medesimo e non limitarsi a sostenere le proprie ragioni solo sulla base delle condanne penali.\n\nL’art. 9 del T.U.I. prevede, infatti, che: «Il permesso di soggiorno UE per soggiornanti di lungo periodo non può essere rilasciato agli stranieri pericolosi per l'ordine pubblico o la sicurezza dello Stato. Nel valutare la pericolosità si tiene conto anche dell'appartenenza dello straniero ad una delle categorie indicate negli articoli 1, 4 e 16 del codice delle leggi antimafia e delle misure di prevenzione, di cui al decreto legislativo 6 settembre 2011, n. 159, ovvero di eventuali condanne anche non definitive, per i reati previsti dall'articolo 380 del codice di procedura penale, nonché, limitatamente ai delitti non colposi, dall'articolo 381 del medesimo codice. Ai fini dell'adozione di un provvedimento di diniego di rilascio del permesso di soggiorno di cui al presente comma il questore tiene conto altresì della durata del soggiorno nel territorio nazionale e dell'inserimento sociale, familiare e lavorativo dello straniero.»\n\nNella comunicazione di avvio del procedimento, tuttavia, non si evince la considerazione sia della durata del soggiorno del sig. Tizio, che del suo inserimento sociale, familiare e lavorativo. Non v’e dubbio che lo stesso, durante il periodo di soggiorno, abbia intrapreso dei legami familiari e amicali significativi, che devono essere tenuti in maggior considerazione, invece di procedere alla revoca della carta di soggiorno in modo “automatico”, solo sulla base di condanne, nemmeno tutte definitive. Per non parlare, poi, della continuità nella prestazione di attività lavorative da parte del sig. Tizio che, una volta uscito dalla Casa Circondariale di [Città], potrà ricoprire nuovamente la propria mansione di manovale all’assemblaggio meccanico presso la [Società Datrice S.p.A.]. Tra le altre cose, si sottolinea nuovamente come l’interessato del procedimento de quo svolga anche attività lavorativa all’interno del carcere; scelta, questa, assolutamente derivante dal senso di responsabilità maturato dal sig. Tizio, consapevole di dover far fronte a diverse spese, tra cui il mantenimento della figlia.\n\nSecondo la pacifica giurisprudenza del Consiglio di Stato, ai sensi dell’art. 9, comma 4, d.lgs. 25 luglio 1998, n. 286, il diniego e la revoca del permesso di soggiorno di lungo periodo non possono essere adottati per il solo fatto che lo straniero abbia riportato sentenze penali di condanna, in quanto al contrario tali misure richiedono un giudizio di pericolosità sociale dello straniero e una motivazione articolata su più elementi, che tenga conto anche della durata del soggiorno sul territorio nazionale e dell’inserimento sociale, familiare e lavorativo dell’interessato, tale da escludere ogni automatismo tra provvedimento sfavorevole e condanne penali (cd. tutela rafforzata dei soggiornanti di lungo periodo: cfr. Cons. Stato, sez. III, 12 aprile 2023, n. 3694; id., 15 luglio 2022, n. 6075; id., 23 luglio 2018, n. 4455; id., 20 ottobre 2016, n. 4401; id., 15 novembre 2016, n. 4708).\n\nDa ultimo, trattandosi in questo caso di revoca della carta di soggiorno per familiari di cittadini UE e trovandosi, il sig. Tizio, nel territorio italiano da più di dieci anni, la valutazione sulla pericolosità sociale richiederebbe uno standard più elevato.\n\n4. Con riferimento al superiore interesse della figlia del sig. Tizio\n\nIl sig. Tizio, come sopra rappresentato, è genitore di una minore e, pertanto, nella fattispecie, sussiste la necessità di bilanciare le esigenze statuali inerenti alla tutela dell'ordine pubblico e della sicurezza nazionale con quelle derivanti da gravi motivi connessi con lo sviluppo psicofisico della figlia [Minore C.].\n\nLa Corte Suprema di Cassazione Civile, a Sezioni Unite, con sentenza n. 15750 del 12.06.2019 ha, invero, pronunciato la seguente massima: «In tema di autorizzazione all’ingresso o alla permanenza in Italia del familiare di minore straniero che si trova nel territorio italiano, ai sensi dell’art. 31, comma 3, del d.lgs. n. 286 del 1998, il diniego non può essere fatto derivare automaticamente dalla pronuncia di condanna per uno dei reati che lo stesso testo unico considera ostativi all’ingresso o al soggiorno dello straniero; nondimeno la detta condanna è destinata a rilevare, al pari delle attività incompatibili con la permanenza in Italia, in quanto suscettibile di costituire una minaccia concreta ed attuale per l’ordine pubblico o la sicurezza nazionale, e può condurre al rigetto della istanza di autorizzazione all’esito di un esame circostanziato del caso e di un bilanciamento con l’interesse del minore, al quale la detta norma, in presenza di gravi motivi connessi con lo sviluppo psicofisico, attribuisce valore prioritario ma non assoluto.»\n\nSecondo la scrivente difesa, la presenza del sig. Tizio in Italia è fondamentale al fine di prevenire danni allo sviluppo psicofisico della minore. Il rapporto padre-figlia, a seguito del percorso di sostegno alla genitorialità che dovrà affrontare il sig. Tizio, è destinato ad una ripresa e, considerando l’assegno di mantenimento e le spese straordinarie a cui deve far fronte lo stesso, un suo allontanamento dal territorio nazionale inciderebbe inevitabilmente anche su tali obblighi.\n\nIn aggiunta, si cita anche la sentenza n. 3392 del 18 aprile 2025, emessa dalla terza sezione del Consiglio di Stato, secondo la quale: «Inoltre, il rischio che la presenza dello straniero in Italia presenta per l’ordine e la sicurezza pubblica, e di cui la condanna è oggettivamente sintomatica, deve essere comparato con gli effetti pregiudizievoli che deriverebbero dal suo allontanamento, e comunque dalla perdita di un legittimo titolo di soggiorno, a carico di valori egualmente meritevoli di tutela, quali la salvaguardia dei legami familiari che lo straniero effettivamente intrattiene sul territorio nazionale».\n\n***\nConclusioni\nAlla luce di quanto sopra esposto e della documentazione allegata, il sig. Tizio, ut supra rappresentato, difeso e domiciliato\n\nCHIEDE\n\nche la Questura di [Città], Ufficio Immigrazione, riconoscendone l’illegittimità, Voglia disporre l’archiviazione o l’annullamento del procedimento di revoca della carta di soggiorno per familiari di cittadini UE rilasciata al sig. Tizio, provvedendo alla conferma della validità della stessa.\nSi allegano:\n1. Carta di soggiorno;\n2. Comunicazione di avvio procedimento;\n3. Accordo di rateizzazione;\n4. Corrispondenza tra l’Avv. [Difensore Penale] e l’UEPE;\n5. Certificato di stato di famiglia;\n6. Contratto di locazione ad uso abitativo;\n7. Percorso lavoratore;\n8. Contratto a tempo indeterminato.\n\n[Città], lì [Data]\n\nAvv. [Difensore 1] Avv. [Difensore 2 — Co-redattrice Modello Principale]",

    "text": "[Città A] – [Città B], [Data comunicazione]\n\nEgregio sig. Avv. [Legale Controparte] [Studio Legale Estero] A mezzo mail: [email-controparte@omissis]\n\nOggetto: Alfa S.a.s. / Beta Co. Ltd – riscontro alla comunicazione del [mese/anno] avente ad oggetto “Notice Regarding Sub-Agengy Agreement: Validity, Breach, and New Commission Arrangement”\n\nFormuliamo la presente in nome e per conto della società Alfa S.a.s., in persona del socio accomandatario sig.ra Tizia, per contestare integralmente il contenuto della Preg.ma Sua del [mese/anno] indicata in oggetto, in quanto infondata in fatto ed in diritto, ed in particolare per precisare quanto segue.\n\nAl fine di meglio dedurre la posizione della nostra assistita in merito alle specifiche contestazioni mosse dalla Beta Co. Ltd, articoleremo la nostra difesa seguendo i punti della Sua missiva.\nAbstract\n1. L’accordo deve ritenersi risolto per la validità del recesso trasmesso dalla nostra cliente o, in ogni caso, per fatti concludenti posti in essere dalla Beta Co. Ltd.\n2. La Alfa S.a.s. non ha commesso alcuna violazione del contratto, anzi rispettato pedissequamente, con impegno e dedizione, per tutta la sua durata.\n3. È illegittima la trattenuta applicata dalla Beta Co. Ltd sulle commissioni dovute.\nPunti aggiuntivi\n4. Intimazione di pagamento per provvigioni pari ad € 18.479,61 (euro) e $ 9.605,37 (dollari USA), di cui € 2.421,14 e $ 945,95 già maturate.\n5. Riserva di agire per il risarcimento dei danni patiti dalla Alfa S.a.s. a seguito di: i) mancato rispetto del termine di preavviso da parte di Beta Co. Ltd; ii) danno all’immagine.\nA) Validità dell’accordo – recesso del [Data 1] valido ed efficace – recesso per fatti concludenti\nIl contratto tra le parti non prevede alcun vincolo sino al [Data scadenza futura].\n\nAl contrario, fermi restando i rinnovi automatici previsti nel contratto, nello stesso è espressamente prevista la facoltà di recesso con preavviso di mesi 6, durante il quale le commissioni maturate rimangono dovute.\n\nÈ dunque previsto un periodo di preavviso per il recesso, situazione di fatto e giuridica ben diversa dalla comunicazione di mancato rinnovo, ipotesi non espressamente disciplinata.\n\nIl recesso trasmesso in data [Data 1] è, dunque, a tutti gli effetti valido ed efficace.\n\nA nulla rilevano le pretestuose contestazioni circa il mittente del recesso e la pec da cui è stato trasmesso; quanto al primo punto, la lettera di recesso è stata sottoscritta dalla sig.ra Tizia, socia accomandataria della Alfa S.a.s., nell’esercizio dei suoi pieni poteri; quanto al secondo punto, la pec è stata regolarmente trasmessa e ricevuta dalla società Sua assistita, prova ne sia la puntuale presa di posizione sul contenuto e sulla forma della stessa.\n\nL’atto di recesso è stato regolarmente ed inconfutabilmente portato a conoscenza della società Beta Co. Ltd ed è dunque, si ribadisce, valido ed efficace agli effetti del contratto e della legge italiana.\n\nIn via subordinata, anche volendo ritenere sussistente un difetto di forma (che, si ribadisce, non sussiste), la società nostra assistita ha nuovamente trasmesso atto di recesso in data [Data 2] tramite la pec [pec-cliente@omissis].\n\nIn ogni caso, poi, anche volendo ritenere invalido (ma non lo è) il recesso trasmesso dalla nostra assistita, il contratto deve ritenersi risolto per fatti concludenti posti in essere dalla Beta Co. Ltd per il tramite del suo rappresentante sig. Sempronio.\n\nInfatti, con comunicazioni scritte inviate alla clientela, è stato espressamente rappresentato che la società Alfa S.a.s. (e così i soci Tizia e Caio) non operava(no) più in qualità di agente, e che, in sua (loro) sostituzione, a decorrere dal [Data 3] sarebbe subentrato un nuovo team operativo per i territori di Italia, Spagna, Francia e Regno Unito, facente capo all’organizzazione [Delta Team] del sig. [Terzo 1], con il sig. [Terzo 2] quale referente operativo. Con riferimento al territorio tedesco, la sostituzione è stata affidata ai sigg. [Terzo 3] e [Terzo 4]. Inoltre, a partire dal [Data 4], è stato revocato alla società nostra assistita l’accesso all’indirizzo di posta elettronica aziendale [email-aziendale@omissis], impedendo di fatto la prosecuzione di qualsiasi attività lavorativa. Tutto ciò è avvenuto in assenza di qualsivoglia comunicazione ufficiale da parte di Beta Co. Ltd relativa alla modifica o cessazione degli obblighi contrattuali in essere.\n\nIn conclusione, è evidente l’accettazione da parte di Beta Co. Ltd del recesso trasmesso dalla nostra assistita, a cui – e su questo si tornerà di seguito – è stato impedito di operare nel periodo di preavviso previsto dal contratto, con enorme danno patrimoniale (da aggiungersi a quello non patrimoniale all’immagine per le condotte denigratorie sopra esposte) da quantificarsi.\nB) Asserite violazioni contrattuali\nLa Alfa S.a.s. ha sempre operato nel rispetto del contratto tra le parti, con impegno e dedizione e raggiungendo negli anni ottimi risultati, prova ne sia la mancata contestazione di qualsivoglia circostanza nel corso del rapporto.\n\nNon ha in alcun modo, poi e nello specifico, commesso alcuno degli addebiti che le vengono contestati.\n\na) Comunicazioni e sollecitazioni non autorizzate ai clienti La contestazione è del tutto generica, priva di specifici riferimenti, a riprova della sua pretestuosità ed infondatezza. Si contesta quindi recisamente tale circostanza.\n\nb) Violazione degli obblighi di esclusività e di non concorrenza Nessun comportamento sleale o anche solo scorretto è stato posto in essere dalla nostra cliente. Fermo restando quanto sopra, il contratto tra le parti non prevede nessun patto di esclusività né di non concorrenza, non avendo – a riprova dell’assenza di tali pattuizioni – la nostra assistita incamerato alcuna indennità correlata, per la loro validità, a tali patti. Da ultimo, anche qui va rilevata l’assoluta genericità delle contestazioni.\n\nc) Mancata gestione adeguata dei reclami dei clienti Tutti i reclami sono stati puntualmente gestiti con la massima trasparenza e professionalità da parte di Alfa S.a.s., sia nei rapporti con Beta Co. Ltd e Gamma Corp., sia nell’interesse e per conto della clientela finale. Con specifico riferimento al caso indicato ([Cliente Delta]), si deve invece rilevare l’estrema superficialità e la carente professionalità con cui Beta Co. Ltd ha gestito non solo la contestazione richiamata, ma più in generale l’intera vicenda. In relazione all’importo del reclamo pari a € 100.000 (allo stato, peraltro, non provato), non può in alcun modo ravvisarsi alcuna negligenza in capo a Alfa S.a.s. Come già evidenziato, la situazione è dipesa esclusivamente da una totale e reiterata mancanza di riscontro da parte di Beta Co. Ltd, nonostante i continui solleciti formulati dalla stessa Alfa S.a.s. Per tali ragioni, è del tutto priva di fondamento altresì la pretesa perdita di commissioni pari a € 20.000, che dunque – al pari delle altre pretese avanzate – viene fermamente respinta.\n\nIn conformità a quanto previsto dall’accordo contrattuale, sono stati mantenuti contatti costanti con la clientela, effettuate visite regolari presso i clienti, e puntualmente comunicate tutte le informazioni commerciali e di mercato rilevanti. Non a caso, numerosi ordini sono stati conclusi sulla base di target price comunicati dal cliente finale, a dimostrazione dell’effettiva attività commerciale svolta.\n\nDa ultimo, non può non rilevarsi come sia del tutto illogico e contraddittorio contestare una presunta carente gestione del mercato e delle contestazioni, laddove Alfa S.a.s. ha generato un fatturato complessivo superiore a € 6.000.000 annui nel periodo compreso tra l’inizio dell’attività nel 2019 e la fine del 2025, risultato che non sarebbe stato in alcun modo conseguibile in assenza di una gestione professionale, continua e concreta dei rapporti commerciali e delle problematiche insorte.\n\nd) Destabilizzazione del mercato Non risponde al vero neanche l’assunto secondo cui sarebbe stata arrecata alcuna destabilizzazione del mercato. Al contrario, Alfa S.a.s. ha continuato a operare in modo regolare, continuativo e conforme agli accordi, fino a quando ciò è stato consentito, e precisamente fino al [Data 4] (data a partire dalla quale è stato negato l’accesso alla mail aziendale in uso alla nostra assistita [email-aziendale@omissis]), provvedendo alla trasmissione puntuale delle richieste commerciali e alla regolare acquisizione di ordini.\n\nIn merito alla dedotta assenza del sig. Caio per un periodo di due anni, si precisa che tale circostanza risale al 2019, in coincidenza con l’avvio della collaborazione con la società Gamma Corp., all’epoca del tutto sconosciuta e non operativa sul mercato europeo. Si rammenta altresì che detto periodo coincideva con l’emergenza pandemica da Covid‑19, che ha comportato un sostanziale blocco delle attività economiche e commerciali a livello internazionale. Ciononostante, la sig.ra Tizia, in collaborazione con il sig. Sempronio e con la stessa Gamma Corp., ha comunque garantito uno sviluppo dell’attività di rilievo, contribuendo in maniera determinante alla crescita del mercato di riferimento. Resta peraltro evidente che il sig. Sempronio, cui va riconosciuta piena autonomia decisionale, avrebbe potuto in qualsiasi momento recedere dal contratto e procedere alla sostituzione, come del resto è accaduto in epoca più recente.\n\nCon riferimento alla situazione medica del sig. Caio, si conferma che lo stesso è stato sottoposto, in data [Data intervento], a un delicato intervento chirurgico salvavita, che prevedeva una fase di convalescenza della durata di circa sei mesi. Nonostante le espresse indicazioni mediche, il sig. Caio si è tuttavia reso nuovamente disponibile a supportare operativamente la sig.ra Tizia già a partire dall’ultima settimana del mese successivo. Va infine evidenziato che, pur a fronte delle condizioni di salute sopra descritte, e su esplicita sollecitazione a effettuare visite presso la clientela, il sig. Caio ha affrontato un viaggio di oltre 4.000 km all’estero, adempiendo concretamente agli impegni assunti e dimostrando, ancora una volta, il costante impegno professionale profuso nello svolgimento dell’attività.\nC) Rivisitazione dell’accordo economico di cui al contratto – illegittimità\nPer le ragioni di cui sopra, Alfa S.a.s. non accetta alcuna ipotesi di revisione, modifica o diversa attuazione dell’accordo relativo al pagamento delle commissioni e chiede, nostro tramite, l’esatta esecuzione del contratto sottoscritto tra le parti.\n\nLe commissioni, comprese quelle maturate nel periodo di preavviso per le ragioni sopra esposte, devono essere corrisposte integralmente ed entro il giorno 10 del mese successivo a quello di maturazione, pena l’applicazione degli interessi per ritardato pagamento, come contrattualmente previsto e comunque ai sensi di legge.\n\nAlfa S.a.s. richiede il pagamento integrale delle commissioni relative agli ordini acquisiti da Alfa S.a.s., come dettagliatamente indicate nell’elenco allegato, per un totale ad oggi pari ad € 18.479,61 (euro) e $ 9.605,37 (dollari USA), di cui € 2.421,14 e $ 945,95 (dollari USA) già maturate e pertanto immediatamente esigibili, per le quali si chiede il pagamento senza ulteriore ritardo.\nD) Azioni richieste\nPer le ragioni si qui evidenziate, si contestato tutte le pretese da ultimo avanzate nella Sua comunicazione e precisamente: a) Alla luce delle comunicazioni trasmesse in data [Data 5] dal sig. Sempronio, con le quali è stata espressamente dichiarata la cessazione immediata del rapporto, Alfa S.a.s., la sig.ra Tizia e il sig. Caio devono ritenersi pienamente liberi di operare sul mercato, non sussistendo più alcun vincolo contrattuale in essere. b) Non vi sono ulteriori comunicazioni da fornire, atteso che il contratto deve considerarsi risolto a far data dal [Data 5]. Resta pertanto fermo e ribadito l’obbligo di procedere alla liquidazione delle provvigioni maturate, nei termini e con le modalità già specificamente indicate. c) Si precisa inoltre che gli obblighi contrattuali risultano essere stati violati per primi dal sig. Sempronio, con conseguente insussistenza di qualsiasi addebito o responsabilità in capo a Alfa S.a.s. d) Si rileva, infine, che il contratto non prevede alcun patto di non concorrenza, né espresso né implicito; ne consegue che non sussiste alcun obbligo di astensione dallo svolgimento di attività concorrenti, risultando pertanto pienamente legittima la prosecuzione dell’attività sul mercato da parte di Alfa S.a.s. e dei soggetti sopra indicati.\nE) Richieste da parte di Alfa S.a.s.\nTutto ciò premesso, ritenendo di aver chiarito la posizione della nostra assistita, ribadiamo con risolutezza che ogni eventuale azione intrapresa da Beta Co. Ltd nei confronti di Alfa S.a.s. e dei suoi soci troverà, nostro tramite, la più ferma opposizione.\n\nPer quanto ampiamente dedotto, poi, risulta dovuto il pagamento integrale delle commissioni relative agli ordini acquisiti da Alfa S.a.s., come dettagliatamente indicate nell’elenco allegato, per un totale ad oggi pari ad € 18.479,61 (euro) e $ 9.605,37 (dollari USA), di cui € 2.421,14 e $ 945,95 (dollari USA) già maturate e pertanto immediatamente esigibili; per queste ultime si chiede dunque l’immediato pagamento, precisando – in difetto – che procederemo con il recupero forzoso del credito senza ulteriore avviso, con aggravio di spese ed interessi ad esclusivo carico.\n\nSi chiede sin da ora, inoltre, per l’esatta quantificazione delle somme di cui sopra, l’invio – anche per il tramite degli scriventi legali – delle “Commercial Invoice” emesse dea Gamma Corp. successivamente al [Data 4] (data di disattivazione della casella mail in uso alla nostra assistita).\n\nIn ogni caso, la scrivente difesa si riserva sin d’ora ogni più opportuna azione, in ogni sede competente, volta a ottenere il risarcimento integrale di tutti gli ulteriori danni subiti dalla propria assistita in conseguenza della illegittima interruzione del rapporto contrattuale nel corso del periodo di preavviso, nonché del grave danno all’immagine e alla reputazione commerciale dalla medesima patita; danno ad oggi quantificabile in non meno di € 60.000,00.\n\nAnaloga tutela risarcitoria sarà azionata in relazione al pregiudizio arrecato ai due soci, sotto il profilo personale e professionale, a seguito di condotte gravemente denigratorie e lesive, concretizzatesi nell’invio indiscriminato di comunicazioni – dal contenuto oggettivamente pregiudizievole – all’intero pacchetto clienti da essi gestito.\n\nDi tali condotte la scrivente dispone di puntuale evidenza documentale, che sarà prodotta nelle competenti sedi a fondamento delle azioni risarcitorie che si renderanno necessarie.\n\nCordiali saluti, Avv. [Difensore 1] – Avv. [Difensore 2]",

    "text": "[Città], data come da messaggio P.E.C. PREFETTURA DI [CITTÀ] – UFFICIO SANZIONI AMMINISTRATIVE (PEC: [pec-prefettura@omissis]) COMANDO DI POLIZIA MUNICIPALE DI [CITTÀ] (PEC: [pec-comune@omissis])\n\nOggetto: ricorso ex art. 203 CdS\n\nIll.mo Sig. Prefetto, Spett.le Comando,\n\nIl sig. Tizio, nato a [Comune] il [OMISSIS] (C.F. [OMISSIS]) e residente in [Indirizzo], in qualità di socio amministratore della società a nome collettivo [Società Alfa S.n.c.], con sede legale in [Indirizzo], C.F./P.IVA [OMISSIS], rappresentata e difesa nel presente procedimento dall’Avv. [Difensore] del Foro di [Città] (C.F. [OMISSIS]), in virtù di mandato che si deposita telematicamente unitamente al presente atto, ed elettivamente domiciliata presso lo Studio in [Indirizzo studio], PEC [pec@omissis], quale proprietario del veicolo targato [TARGA OMISSIS]\n\nPROPONE\n\ncon il presente atto, formale opposizione avverso il Verbali di contestazione:\n\n* n. [VERBALE 01] – [VERBALE 11], emessi tra il 05.02.2026 e il 13.02.2026 (notificati tra il 23.02.2026 e il 03.03.2026) + [verbale mancante]\n\ndalla Polizia Locale di [Città] per la presunta violazione dell’art. 7 comma 7 e 14 del Codice della Strada per i seguenti\nMOTIVI\n1. Reiterazione specifica della condotta ai sensi dell’art. 8-bis L. 689/1981 Il sig. [Tizio — refuso di cognome nell'originale], in qualità di socio amministratore collettivo della società [Società Alfa S.n.c.], è sempre stato in possesso dell’autorizzazione per entrare nel Centro Storico di [Città], nelle zone ZTL. Per una disattenzione, il ricorrente ha ritenuto che l’autoveicolo aziendale, in virtù della Sua natura elettrica, dovesse ritenersi esentato dagli obblighi di accesso relativi alla Zona a Traffico Limitato. Nei termini di ciò ha comportato l’irrogazione della sanzione n. [VERBALE 01], notificato in data 23.02.2026, emesso in data 05.02.2026 e quelle successive (Verbali ut supra rappresentati), per tanto si contesta l'illegittima duplicazione delle sanzioni per i giorni immediatamente successivi (dal 06.02.2026 al 13.02.2026). Tali accessi in zona ZTL ravvicinati costituiscono una condotta unitaria e una reiterazione specifica ex art. 8-bis L. 689/81. La Cassazione con Ordinanza n. 19680/2024 ha ritenuto che le violazioni, in tempi diversi e ravvicinati, del medesimo art. 7 c. 9 e 14 C.d.S., per mancanza del permesso di accesso a ZTL, devono, invece, essere considerate come un'unica infrazione in quanto reiterazioni del medesimo illecito amministrativo, si richiede, pertanto, l'annullamento dei verbali successivi al primo, con conseguente ricalcolo della sanzione limitatamente alla sola violazione originaria.\n\n2. Buona fede / errore scusabile Si eccepisce l'assoluta mancanza dell'elemento soggettivo richiesto per la configurabilità dell'illecito amministrativo, ai sensi dell'art. 3 della Legge 689/1981. Il ricorrente ha fatto ingresso nella Zona a Traffico Limitato agendo in buona fede, determinato da un incolpevole e scusabile errore di fatto sulle caratteristiche tecniche del veicolo. Nello specifico, il ricorrente era convinto di trovarsi alla guida di un’autovettura interamente elettrica. Nella ragionevole certezza che tale veicolo godesse dell'esenzione totale dal divieto di accesso alla ZTL – come previsto dalle normative comunali per la mobilità sostenibile del Comune di [Città] – il ricorrente ha transitato senza alcuna intenzione (né dolosa né colposa) di violare il Codice della Strada. Tale affidamento incolpevole, unito alla mancata contestazione immediata o notifica tempestiva da parte dell'Amministrazione (che avrebbe permesso al cittadino di rendersi conto del suddetto errore e cessare la violazione del Cds), priva la violazione del suo elemento soggettivo, rendendo di fatto illegittima l'irrogazione della sanzione.\nRichiesta\nPer tutti i motivi sopra esposti, il sottoscritto Avv. [Difensore] CHIEDE che l'Ill.mo sig. Prefetto di [Città] Voglia annullare i verbali di accertamento di violazio function splitItalianLegalSentences(text) {
  if (!text || !text.trim()) return [];
  const abbrevs = [
    'artt', 'art', 'c\\.p\\.c', 'c\\.p\\.p', 'c\\.p\\.a', 'c\\.p', 'c\\.c', 'c\\.d\\.s', 'cds',
    'd\\.lgs', 'd\\.p\\.r', 'd\\.p\\.c\\.s', 'd\\.m', 'd\\.l', 'l', 'n', 'nn', 'co', 'commi',
    'lett', 'sez', 'ss\\.uu', 'cfr', 'id', 'pag', 'pagg', 'doc', 'all', 'gg', 'sig', 'sig\\.ra',
    'sigg', 'avv', 'avv\\.ti', 'dott', 'dott\\.ssa', 'prof', 'spett\\.le', 'ill\\.mo', 'preg\\.ma',
    's\\.p\\.a', 's\\.r\\.l', 's\\.a\\.s', 's\\.n\\.c', 'ltd', 'corp', 'r\\.g\\.n\\.r',
    'r\\.g\\.g\\.i\\.p', 'r\\.g', 'p\\.e\\.c', 'c\\.f', 'p\\.iva', 'i\\.v\\.a',
    't\\.u\\.i', 'c\\.d', 'cd', 'es', 'v', 'segg', 'ss', 'cit', 'op', 'd\\.i'
  ];
  const PLACEHOLDER = '\uE000';
  let protectedText = text;
  protectedText = protectedText.replace(/(\d)\.(\d)/g, '$1' + PLACEHOLDER + '$2');
  protectedText = protectedText.replace(/\.{2,}/g, m => PLACEHOLDER.repeat(m.length));
  protectedText = protectedText.replace(/(^|\n)\s*(\d+)\.\s+/g, '$1$2' + PLACEHOLDER + ' ');
  const abbrRegex = new RegExp('\\b(' + abbrevs.join('|') + ')\\.', 'gi');
  protectedText = protectedText.replace(abbrRegex, m => m.replace(/\./g, PLACEHOLDER));
  protectedText = protectedText.replace(/\b([A-Z])\./g, '$1' + PLACEHOLDER);

  const rawChunks = protectedText.split(/(?<=[.!?])\s+|\n+/);
  const sentences = [];
  for (const chunk of rawChunks) {
    const restored = chunk.replace(new RegExp(PLACEHOLDER, 'g'), '.').trim();
    if (restored && countWords(restored) > 0) sentences.push(restored);
  }
  return sentences;
}

function countWords(text) {
  const matches = (text || '').match(/[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*/g);
  return matches ? matches.length : 0;
}

function countLetters(text) {
  const matches = (text || '').match(/[A-Za-zÀ-ÖØ-öø-ÿ]/g);
  return matches ? matches.length : 0;
}

function countCharsNoSpaces(text) {
  return (text || '').replace(/\s+/g, '').length;
}

function escapeHtml(str) {
  return (str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Formula ufficiale Gulpease (Lucisano & Piemontese): 89 + (300*frasi - 10*lettere)/parole
function computeGulpease(text) {
  const words = countWords(text);
  if (words === 0) {
    return { score: 0, words: 0, sentences: 0, letters: 0, avgWords: 0, label: '—', tone: '', sentencesList: [] };
  }
  const sentencesList = splitItalianLegalSentences(text);
  const sentences = Math.max(1, sentencesList.length);
  const letters = countLetters(text);
  const raw = 89 + ((300 * sentences) - (10 * letters)) / words;
  const score = Math.max(0, Math.min(100, Math.round(raw)));
  const avgWords = +(words / sentences).toFixed(1);

  let label = 'Complesso (<40)';
  let tone = 'bad';
  if (score >= 60) { label = 'Ottimo (≥60)'; tone = 'good'; }
  else if (score >= 48) { label = 'Chiaro (48–59)'; tone = 'good'; }
  else if (score >= 40) { label = 'Da snellire (40–47)'; tone = 'warn'; }
  return { score, words, sentences, letters, avgWords, label, tone, sentencesList };
}

function analyzeLegalText(text) {
  const gulp = computeGulpease(text || '');
  const charsNoSpaces = countCharsNoSpaces(text || '');

  // SSM 2023 sentence length thresholds: green <= 25, orange 26-35, red > 35
  const warnWords = 25;
  const badWords = 35;
  const longSentences = [];
  const veryLongSentences = [];
  gulp.sentencesList.forEach((s, idx) => {
    const w = countWords(s);
    if (w > badWords) veryLongSentences.push({ index: idx + 1, words: w, text: s });
    else if (w > warnWords) longSentences.push({ index: idx + 1, words: w, text: s });
  });

  const findings = [];
  let spanishCount = 0, buroCount = 0, nomCount = 0, acutCount = 0, typoCount = 0;

  const runRules = (rules, type) => {
    rules.forEach(r => {
      r.pattern.lastIndex = 0;
      const hits = (text || '').match(r.pattern);
      if (hits && hits.length) {
        if (type === 'es') spanishCount += hits.length;
        else if (type === 'buro') buroCount += hits.length;
        else if (type === 'nom') nomCount += hits.length;
        else if (type === 'acut') acutCount += hits.length;
        else if (type === 'typo') typoCount += hits.length;
        findings.push({
          type,
          count: hits.length,
          label: r.label,
          match: hits[0],
          suggestion: r.suggestion || r.fix || '',
          reason: r.reason || r.note || ''
        });
      }
    });
  };

  runRules(SPANISHISM_RULES, 'es');
  runRules(TYPO_RULES, 'typo');
  runRules(ACUTEZZA_RULES, 'acut');
  runRules(NOMINALIZATION_RULES, 'nom');
  runRules(BUROCRATESE_RULES, 'buro');

  const avgTone = gulp.words === 0 ? '' : (gulp.avgWords <= 25 ? 'good' : (gulp.avgWords <= 35 ? 'warn' : 'bad'));
  const docRefsCount = ((text || '').match(/\(doc\.\s*\d+[^)]*\)/gi) || []).length;
  const highlightedHtml = buildHighlightedHtml(gulp.sentencesList, warnWords, badWords);

  return {
    words: gulp.words,
    sentences: gulp.sentences,
    letters: gulp.letters,
    avgWords: gulp.avgWords,
    avgTone,
    charsNoSpaces,
    gulpease: gulp.score,
    gulpeaseLabel: gulp.label,
    gulpeaseTone: gulp.tone,
    longSentences,
    veryLongSentences,
    spanishCount,
    buroCount,
    nomCount,
    acutCount,
    typoCount,
    docRefsCount,
    findings,
    highlightedHtml
  };
}

function buildHighlightedHtml(sentencesList, warnWords, badWords) {
  if (!sentencesList || !sentencesList.length) {
    return '<span style="color:var(--ink-muted)">Scrivi o incolla il tuo testo qui sopra: l\'analisi live (SSM, Burocratese, Nominalizzazioni, Acutezza e Ispanismi in viola) apparirà qui in tempo reale.</span>';
  }
  return sentencesList.map(s => {
    const w = countWords(s);
    // Tokenize safely without nested span corruption using sentinel markers
    const matches = [];
    const collect = (rules, cls) => {
      rules.forEach(r => {
        const rx = new RegExp(r.pattern.source, 'gi');
        let m;
        while ((m = rx.exec(s)) !== null) {
          matches.push({
            start: m.index,
            end: m.index + m[0].length,
            cls,
            tip: (r.suggestion || r.fix || r.reason || r.note || '')
          });
        }
      });
    };
    collect(SPANISHISM_RULES, 'tok-es');
    collect(TYPO_RULES, 'tok-typo');
    collect(ACUTEZZA_RULES, 'tok-acut');
    collect(NOMINALIZATION_RULES, 'tok-nom');
    collect(BUROCRATESE_RULES, 'tok-buro');

    // Sort by start index, priority: es > typo > acut > nom > buro
    const prio = { 'tok-es': 1, 'tok-typo': 2, 'tok-acut': 3, 'tok-nom': 4, 'tok-buro': 5 };
    matches.sort((a, b) => a.start - b.start || prio[a.cls] - prio[b.cls]);

    let html = '';
    let cursor = 0;
    for (const m of matches) {
      if (m.start < cursor) continue; // skip overlap
      html += escapeHtml(s.slice(cursor, m.start));
      html += `<span class="${m.cls}" title="${escapeHtml(m.tip)}">${escapeHtml(s.slice(m.start, m.end))}</span>`;
      cursor = m.end;
    }
    html += escapeHtml(s.slice(cursor));

    if (w > badWords) {
      return `<span class="sent-bad" title="Periodo critico: ${w} parole (rosso >35)">${html}</span>`;
    } else if (w > warnWords) {
      return `<span class="sent-warn" title="Periodo lungo: ${w} parole (arancione 26–35)">${html}</span>`;
    }
    return html;
  }).join(' ');
}

function scanPrivacyRisks(text) {
  const risks = [];
  if (!text) return risks;
  const patterns = [
    { type: 'Codice Fiscale', placeholder: '[CF OMISSIS]', regex: /\b[A-Z]{6}\d{2}[A-EHLMPR-T]\d{2}[A-Z]\d{3}[A-Z]\b/gi },
    { type: 'Email / PEC', placeholder: '[EMAIL/PEC OMISSIS]', regex: /\b[A-Za-z0-9._%+-]+@(?!omissis\b)[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/gi },
    { type: 'Telefono / Cellulare', placeholder: '[TEL OMISSIS]', regex: /(?:\+39[\s.-]?)?(?:3\d{2}|0\d{1,3})[\s.-]?\d{3}[\s.-]?\d{3,4}\b/g },
    { type: 'Data di nascita', placeholder: '$1[DATA NASCITA OMISSIS]', regex: /(\b(?:nat[oa]\s+(?:a|in)\s+[^,\n]{1,35}\s+il|data\s+di\s+nascita[:\s]+)\s*)(\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{2,4})\b/gi, captureGroup: 2 },
    { type: 'IBAN italiano', placeholder: '[IBAN OMISSIS]', regex: /\bIT\d{2}[A-Z]\d{10}[0-9A-Z]{12}\b/gi }
  ];
  patterns.forEach(p => {
    let m;
    p.regex.lastIndex = 0;
    const found = new Set();
    while ((m = p.regex.exec(text)) !== null) {
      found.add(p.captureGroup ? m[p.captureGroup] : m[0]);
    }
    if (found.size > 0) risks.push({ type: p.type, matches: Array.from(found) });
  });
  return risks;
}

function redactPrivacyRisks(text) {
  let clean = text || '';
  clean = clean.replace(/\b[A-Z]{6}\d{2}[A-EHLMPR-T]\d{2}[A-Z]\d{3}[A-Z]\b/gi, '[CF OMISSIS]');
  clean = clean.replace(/\b[A-Za-z0-9._%+-]+@(?!omissis\b)[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/gi, '[EMAIL/PEC OMISSIS]');
  clean = clean.replace(/(?:\+39[\s.-]?)?(?:3\d{2}|0\d{1,3})[\s.-]?\d{3}[\s.-]?\d{3,4}\b/g, '[TEL OMISSIS]');
  clean = clean.replace(/(\b(?:nat[oa]\s+(?:a|in)\s+[^,\n]{1,35}\s+il|data\s+di\s+nascita[:\s]+)\s*)(\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{2,4})\b/gi, '$1[DATA NASCITA OMISSIS]');
  clean = clean.replace(/\bIT\d{2}[A-Z]\d{10}[0-9A-Z]{12}\b/gi, '[IBAN OMISSIS]');
  return clean;
}

function generateAutoSkeleton(text, title, area) {
  let sk = (text || '').trim();
  sk = sk.replace(/(?:€|\$|EUR|USD)\s?\d{1,3}(?:\.\d{3})*(?:,\d{2})?/g, '[IMPORTO]');

  sk = sk.replace(/\(doc\.\s*\d+[^)]*\)/gi, '(doc. [NNN] — [DOCUMENTO PROBATORIO])');
  sk = sk.replace(/\b(?:19|20)\d{2}\b/g, '[ANNO]');
  sk = sk.replace(/\b(sig\.ra|sig\.)\s+[A-Z][a-zàèéìòù]+/g, '$1 [PARTE]');
  sk = sk.replace(/\b(?:Alfa|Beta|Gamma)\s+(?:S\.a\.s\.|S\.n\.c\.|S\.p\.A\.|S\.r\.l\.|Co\.\s*Ltd|Corp\.)/gi, '[SOCIETÀ / ENTE]');

function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function copyText(text, okMsg) {
  const done = () => showToast(okMsg || 'Copiato negli appunti!');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  if (cb) cb();
}

function getDayObj(num) {
  return ALL_DAYS.find(d => d.day === num) || ALL_DAYS[0];

function getNextRecommendedDay() {
  for (const d of ALL_DAYS) {
    if (!STATE.completedDays[d.day]) return d.day;
  }
  return 30;
}

function stopTimer() {
  if (TIMER_INTERVAL) {
    clearInterval(TIMER_INTERVAL);
    TIMER_INTERVAL = null;
  }
  TIMER_RUNNING = false;
}

function formatMMSS(sec) {
  const s = Math.max(0, Math.floor(sec));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

function resetTimerForDay(dayObj) {

function isStage2Done(day) {
  const d = getDayObj(day);

  return d.spanishDrill.items.every((item, i) => ans[i] !== undefined && item.options[ans[i]] && item.options[ans[i]].ok);
}

function isStage3Done(day) {
  const qr = STATE.quizResults[day];
  return !!(qr && qr.passed);
}

function isStage4Done(day) {
  const d = getDayObj(day);
  const txt = STATE.writingDrafts[day] || '';
  return countWords(txt) >= d.writing.minWords;
}

function renderDayRunner(root, d) {
  const st = STATE.activeStage;
  const s2Ok = isStage2Done(d.day);
  const s3Ok = isStage3Done(d.day);
  const s4Ok = isStage4Done(d.day);
  const isDone = !!STATE.completedDays[d.day];

  const stages = [
    { n: 1, k: 'Fase 1 · 6m', l: 'Lezione', done: st > 1 || isDone },

  ];

  const stepperHtml = stages.map(s => `

function ensureDrillState(day, drill) {
  if (!STATE.drillState[day]) {
    if (drill.type === 'sorter') STATE.drillState[day] = { picks: {} };
    else if (drill.type === 'scalpel') STATE.drillState[day] = { cuts: {} };
    else if (drill.type === 'nominal') STATE.drillState[day] = { picks: {} };
    else if (drill.type === 'hunt') STATE.drillState[day] = { found: {}, lastFb: '' };
    else if (drill.type === 'order') STATE.drillState[day] = { placed: [], hint: '' };
    else if (drill.type === 'xray') STATE.drillState[day] = { opened: {} };
  }
  return STATE.drillState[day];
}
